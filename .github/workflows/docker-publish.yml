name: Build and Publish Docker image

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/fermh:latest
            ghcr.io/${{ github.repository_owner }}/fermh:${{ github.sha }}
          file: ./Dockerfile
          # optionally enable cache; comment out if not required
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate changelog from commits
        id: changelog
        run: |
          git fetch --tags --prune
          # Find previous tag (if any)
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog between $PREV_TAG and ${GITHUB_REF_NAME}"
            CHANGELOG=$(git log ${PREV_TAG}..${GITHUB_SHA} --pretty=format:'- %s (%h)')
          else
            echo "No previous tag found, using recent commits"
            CHANGELOG=$(git log -n 50 --pretty=format:'- %s (%h)')
          fi
          # Fallback message if no commits found
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Automated release for ${GITHUB_REF_NAME}."
          fi
          # Write to GITHUB_OUTPUT for subsequent steps
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
